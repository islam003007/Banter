name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Banter.slnx

      - name: Build
        run: dotnet build Banter.slnx --no-restore

      - name: Test
        run: dotnet test Banter.UnitTests/Banter.UnitTests.csproj --no-build --nologo
