name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Banter.slnx

      - name: Build
        run: dotnet build Banter.slnx --no-restore

      - name: Unit tests
        run: dotnet test --project Banter.UnitTests/Banter.UnitTests.csproj --no-build

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Banter.slnx

      - name: Build
        run: dotnet build Banter.slnx --no-restore

      # GitHub-hosted Ubuntu runners provide Docker, so Testcontainers starts the real
      # PostgreSQL and Redis instances used by the suite.
      - name: Integration tests
        run: dotnet test --project Banter.IntegrationTests/Banter.IntegrationTests.csproj --no-build
